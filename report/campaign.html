<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campaign Monitor — XAUUSD Optimization</title>
<style>
  :root {
    --bg:#0d1017; --panel:#151a23; --panel2:#1a202c; --border:#242c3a;
    --text:#e8eaf0; --muted:#8b93a7; --gold:#d4af37; --gold-soft:rgba(212,175,55,.14);
    --green:#34d399; --green-soft:rgba(52,211,153,.12); --red:#f87171; --red-soft:rgba(248,113,113,.12);
    --blue:#60a5fa;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:14px; }
  .wrap { max-width:1180px; margin:0 auto; padding:20px 24px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:18px; }
  h1 { font-size:17px; margin:0; display:flex; align-items:center; gap:10px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); }
  .dot.live { background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 1.6s infinite; }
  .dot.done { background:var(--muted); box-shadow:none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .muted { color:var(--muted); font-size:12px; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:650; }
  .pill.live { background:var(--green-soft); color:var(--green); }
  .pill.done { background:var(--panel2); color:var(--muted); }

  .bar-wrap { background:var(--panel2); border-radius:999px; height:10px; overflow:hidden; margin-top:6px; }
  .bar-fill { height:100%; background:linear-gradient(90deg,var(--gold),#f3d97a); border-radius:999px; transition:width .5s; }

  .phases { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin:18px 0; }
  .phase { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px; position:relative; }
  .phase.running { border-color:var(--green); }
  .phase.done { opacity:.82; }
  .phase h3 { margin:0 0 8px; font-size:13px; text-transform:capitalize; display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .phase .big { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .phase .sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .stat-good { color:var(--green); } .stat-bad { color:var(--muted); }

  .card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:18px; }
  .card h2 { font-size:14px; margin:0 0 12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th { text-align:left; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    padding:7px 10px; border-bottom:1px solid var(--border); }
  th.num,td.num { text-align:right; }
  td { padding:8px 10px; border-bottom:1px solid var(--border); }
  tr:last-child td { border-bottom:none; }
  .badge { padding:2px 9px; border-radius:999px; font-size:11px; font-weight:650; }
  .badge.met { background:var(--green-soft); color:var(--green); }
  .badge.no { background:var(--red-soft); color:var(--red); }
  .badge.fam { background:var(--gold-soft); color:var(--gold); }

  .verdict { padding:16px 20px; border-radius:12px; font-size:15px; font-weight:650; margin-bottom:18px; }
  .verdict.met { background:var(--green-soft); border:1px solid var(--green); color:var(--green); }
  .verdict.no { background:var(--red-soft); border:1px solid var(--red); color:var(--red); }

  details { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 16px; }
  summary { cursor:pointer; font-size:13px; color:var(--muted); }
  pre { background:var(--panel2); border-radius:8px; padding:12px; overflow:auto; font-size:11.5px;
    line-height:1.5; max-height:320px; margin:12px 0 0; color:#c5ccda; }
  .hb { font-size:12px; color:var(--muted); margin-top:6px; }
  .hb b { color:var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot live" id="dot"></span> Campaign Monitor <span class="muted" id="phase"></span></h1>
    <div style="text-align:right">
      <span class="pill live" id="statePill">running</span>
      <div class="muted" id="dataInfo" style="margin-top:4px"></div>
    </div>
  </header>

  <div id="verdictBox"></div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:baseline">
      <h2 style="margin:0">Elapsed</h2>
      <span class="muted" id="elapsedText"></span>
    </div>
    <div class="bar-wrap"><div class="bar-fill" id="elapsedBar" style="width:0%"></div></div>
    <div class="hb" id="heartbeat"></div>
  </div>

  <div class="phases" id="phases"></div>

  <div class="card">
    <h2>OOS Finalists <span class="muted" id="finCount"></span></h2>
    <table>
      <thead><tr>
        <th>Family</th><th class="num">Trades</th><th class="num">Win %</th>
        <th class="num">PF</th><th class="num">Max DD</th><th class="num">Score</th>
        <th class="num">MC p5 WR</th><th class="num">MC p95 DD</th><th>Targets</th>
      </tr></thead>
      <tbody id="finBody"><tr><td colspan="9" class="muted">No OOS results yet — finalists appear after all families finish.</td></tr></tbody>
    </table>
  </div>

  <details>
    <summary>Raw log tail</summary>
    <pre id="logTail"></pre>
  </details>

  <p class="muted" id="footer" style="text-align:center; margin-top:18px"></p>
</div>

<script>
const TARGET_WR = 90, TARGET_PF = 2, TARGET_DD = 10;

function fmtDur(s) {
  if (s == null) return "—";
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return `${h}h ${String(m).padStart(2,'0')}m`;
}

function phaseCard(name, p) {
  const st = p.status;
  const cls = st === "running" ? "running" : st === "done" ? "done" : "";
  const trials = p.trials ? p.trials.toLocaleString() : "—";
  const best = p.best_train ?? (p.status === "pending" ? "queued" : "—");
  const bestNum = parseFloat(best);
  const bestCls = !isNaN(bestNum) ? (bestNum >= 1 ? "stat-good" : "") : "stat-bad";
  const alloc = p.alloc_h != null ? `${p.alloc_h.toFixed(2)}h budget` : "";
  const val = p.val_score != null ? ` · VAL ${p.val_score}` : "";
  const chip = st === "running" ? '<span class="pill live">running</span>'
             : st === "done" ? '<span class="pill done">done</span>' : '';
  return `<div class="phase ${cls}">
    <h3>${name.replace('_',' ')} ${chip}</h3>
    <div class="big">${trials}<span class="sub" style="font-size:12px"> trials</span></div>
    <div class="sub">best TRAIN <span class="${bestCls}" style="font-weight:650">${best}</span>${val}</div>
    <div class="sub">${alloc}</div>
  </div>`;
}

async function tick() {
  let s;
  try { s = await (await fetch('/api/status')).json(); }
  catch (e) { document.getElementById('phase').textContent = '(monitor offline)'; return; }

  const running = s.running;
  document.getElementById('dot').className = 'dot ' + (running ? 'live' : 'done');
  document.getElementById('phase').textContent = s.phase ? '· ' + s.phase : '';
  const pill = document.getElementById('statePill');
  pill.textContent = running ? 'running' : 'complete';
  pill.className = 'pill ' + (running ? 'live' : 'done');
  document.getElementById('dataInfo').textContent = s.data ? `XAUUSD · ${s.data}` : '';

  // elapsed bar
  const budget = (s.budget_h || 8) * 3600;
  const pct = Math.min(100, (s.elapsed_s || 0) / budget * 100);
  document.getElementById('elapsedBar').style.width = pct + '%';
  document.getElementById('elapsedText').textContent =
    `${fmtDur(s.elapsed_s)} / ${s.budget_h || 8}h  (${pct.toFixed(0)}%)`;

  // heartbeat
  const hbName = (s.phase || '').split(': ')[1];
  const hb = s.heartbeat[hbName];
  document.getElementById('heartbeat').innerHTML = hb
    ? `Live: <b>${hbName}</b> trial ${hb.trial.toLocaleString()} · best ${hb.best} · ${hb.at}`
    : (running ? 'Waiting for next heartbeat…' : '');

  // verdict
  const vb = document.getElementById('verdictBox');
  if (s.verdict) {
    const met = s.verdict === 'MET';
    vb.innerHTML = `<div class="verdict ${met?'met':'no'}">
      ${met ? '✅ TARGETS MET' : '❌ TARGETS NOT MET'} — ran ${s.ran_h ?? ''}h ·
      WR≥${TARGET_WR}%, PF>${TARGET_PF}, DD<${TARGET_DD}pts, ≥30 trades</div>`;
  } else { vb.innerHTML = ''; }

  // phases
  const order = ['breakout','mean_reversion','rsi_fade','ml'];
  let html = order.map(n => phaseCard(n, s.families[n] || {status:'pending'})).join('');
  if (s.refinement) html += phaseCard('refinement: ' + s.refinement.family,
    {status:s.refinement.status, trials:s.refinement.trials_added,
     best_train:s.refinement.best_train, alloc_h:s.refinement.alloc_h});
  document.getElementById('phases').innerHTML = html;

  // finalists
  const fb = document.getElementById('finBody');
  if (s.finalists && s.finalists.length) {
    document.getElementById('finCount').textContent = `(${s.finalists.length})`;
    fb.innerHTML = s.finalists.map(f => {
      const wrCls = f.win_rate >= TARGET_WR ? 'stat-good' : '';
      const ddCls = parseFloat(f.dd) < TARGET_DD ? 'stat-good' : '';
      const pfCls = parseFloat(f.pf) > TARGET_PF ? 'stat-good' : '';
      const mc = f.mc ? `<td class="num">${f.mc.wr_p5 ?? '—'}</td><td class="num">${f.mc.dd_p95 ?? '—'}</td>`
                      : '<td class="num muted">—</td><td class="num muted">—</td>';
      const tgt = f.targets_met == null ? ''
        : f.targets_met ? '<span class="badge met">✓ MET</span>' : '<span class="badge no">✗</span>';
      return `<tr>
        <td><span class="badge fam">${f.family}</span></td>
        <td class="num">${f.trades}</td>
        <td class="num ${wrCls}">${f.win_rate.toFixed ? f.win_rate.toFixed(1) : f.win_rate}%</td>
        <td class="num ${pfCls}">${f.pf}</td>
        <td class="num ${ddCls}">${f.dd}</td>
        <td class="num">${f.score}</td>
        ${mc}<td>${tgt}</td></tr>`;
    }).join('');
  }

  document.getElementById('logTail').textContent = (s.log_tail || []).join('\n');
  document.getElementById('footer').textContent =
    `updated ${new Date().toLocaleTimeString()} · auto-refresh 4s`;
}

tick();
setInterval(tick, 4000);
</script>
</body>
</html>
